name: Regenerate Bun lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main_v2
    paths:
      - "package.json"
      - "packages/*/package.json"
      - "bun.lock"
      - ".github/workflows/regenerate-bun-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main_v2
        uses: actions/checkout@v4
        with:
          ref: main_v2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Regenerate lockfile from package manifests
        run: bun install

      - name: Commit updated lockfile if needed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Regenerate Bun lockfile"
          git push origin HEAD:main_v2
